[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-fabric-enterprise-adapters"
version = "0.1.1"
description = "Private enterprise adapter layer and SaaS source connectors for Knowledge Fabric and Intent Fabric"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "sagarv48" }
]
keywords = ["mcp", "knowledge-fabric", "adapters", "rag", "retrieval", "enterprise"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
]
# Core connectors and contracts use Python standard library only
dependencies = []

[project.urls]
Homepage = "https://github.com/sagarv48/knowledge-fabric-enterprise-adapters"
"Bug Tracker" = "https://github.com/sagarv48/knowledge-fabric-enterprise-adapters/issues"

[project.scripts]
enterprise-adapters-mcp = "enterprise_adapters.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.4.0", "pyright>=1.1.0"]
mcp = ["mcp>=1.10.0"]
pdf = ["pypdf>=5.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["enterprise_adapters*", "knowledge_fabric_adapters*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W292", "W293"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ALL"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=enterprise_adapters --cov=knowledge_fabric_adapters --cov-report=term-missing --cov-fail-under=90"
